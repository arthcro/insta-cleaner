<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Clean</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
        }

        /* 1. Masquer les Reels dans la barre de navigation et les flux */
        a[href*="/reels/"], 
        div[role="tab"]:has(svg[aria-label="Reels"]),
        svg[aria-label="Reels"] {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="app-container" style="padding: 20px; text-align: center; font-family: sans-serif;">
        <h2>Mon Instagram Sans Reels</h2>
        <p>Pour charger l'interface d'Instagram proprement, on va préparer l'injection des styles.</p>
        <p><a href="https://www.instagram.com" target="_blank" style="color: #0095f6; font-weight: bold; text-decoration: none;">Ouvrir Instagram directement</a></p>
    </div>

    <script>
        // MutationObserver pour surveiller les changements du DOM en temps réel
        const cleanInstagram = () => {
            // Sélectionne et supprime dynamiquement les blocs indésirables (ex: Reels, suggestions de pubs, etc.)
            const elementsToRemove = document.querySelectorAll('a[href*="/reels/"], div[data-visualcompletion="loading-state"]');
            
            elementsToRemove.forEach(el => {
                el.style.display = 'none';
            });
        };

        // Lancer l'observation continue des modifications de la page
        const observer = new MutationObserver((mutations) => {
            cleanInstagram();
        });

        observer.observe(document.body, {
            childList: true,
            subtree: true
        });

        console.log("Nettoyeur Instagram initialisé !");
    </script>
</body>
</html>
